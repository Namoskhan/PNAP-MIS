    image: shumailkhan007/pnap-mis:latest
    container_name: pnap-mis-app
    restart: always
    ports:
      - "80:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://shumailkhan7878_db_user:EtjuMwGp4bEJz5zG@cluster0.93heict.mongodb.net/pnap_mis?retryWrites=true&w=majority}
