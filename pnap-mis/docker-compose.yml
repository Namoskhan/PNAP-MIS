version: '3.8'

services:
  app:
    image: shumailkhan007/pnap-mis:latest
    container_name: pnap-mis-app
    restart: always
    ports:
      - "${HOST_PORT:-80}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-*}
    volumes:
      - uploads-data:/app/server/uploads
      - exports-data:/app/server/exports

volumes:
  uploads-data:
  exports-data:
