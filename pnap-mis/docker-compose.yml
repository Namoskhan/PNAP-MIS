version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pnap-mis:latest
    container_name: pnap-mis-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/pnap_mis}
      - JWT_SECRET=${JWT_SECRET:-secret-jwt-key-demo-change-me}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-*}
      - APP_URL=${APP_URL:-http://localhost:5000}
    volumes:
      - uploads-data:/app/uploads
      - exports-data:/app/server/exports
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: pnap-mis-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  uploads-data:
  exports-data:
  mongo-data:
